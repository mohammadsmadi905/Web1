<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Absolute inside Relative</title>
<style>
.container {
  position: relative;
  width: 300px;
  height: 200px;
  background-color: lightgray;
  padding: 10px;
}

.box {
  position: absolute;
  top: 50px;
  left: 100px;
  width: 50px;
  height: 50px;
  background-color: red;
}
</style>
</head>
<body>

<div class="container">
  <p>هذا نص داخل الحاوية. لاحظ أن الصندوق الأحمر يتحرك فوق النص لأنه عنصر مطلق.</p>
  <div class="box"></div>
  <p>نص إضافي أسفل الصندوق الأحمر.</p>
</div>

</body>
</html>
